# Mosquitto broker for NanitesLab.
# Receives LoRaWAN uplinks from the Milesight UG65 gateways.

listener 1883
allow_anonymous true

# Persist retained messages / sessions across restarts.
persistence true
persistence_location /mosquitto/data/

# Keep logs inside the container volume.
log_dest file /mosquitto/log/mosquitto.log

# SECURITY: the broker listens on a public port. Once the gateway IPs are
# known, enable authentication by generating a password file and uncommenting:
#
#   password_file /mosquitto/config/passwd
#   allow_anonymous false
#
# (Create the file with: `mosquitto_passwd -c passwd <username>`.)
